<p>nested-tree1 works!</p>

<mat-tree
  #tree
  [dataSource]="dataSource"
  [childrenAccessor]="childrenAccessor"
  [trackBy]="trackByFn"
  [expansionKey]="expansionKeyFn"
  class="entire-tree"
>
  <!----------------
  --- leaf nodes ---
  ----------------->

  <!-- _note: Use <mat-nested-tree-node> for nodes of a nesteed tree  -->
  <mat-nested-tree-node *matTreeNodeDef="let node">
    <div class="single-node-item--outer">
      <!-- _note: class="mat-tree-node" still can be used for styling -->
      <div class="mat-tree-node"
           [class.node-selected]="selectedNodeId() === node.id"
           (click)="onClick(node)"
           (contextmenu)="onContextMenu($event, node)">
        <mat-icon>memory</mat-icon>
        <div class="single-node-item--inner">
          {{node.name}}
        </div>
      </div>
    </div>
  </mat-nested-tree-node>
      
  <!----------------------
  --- expandable nodes ---
  ----------------------->

  <!-- _note:
    It seems that if there's multiple <mat-nested-tree-node> with "when",
    only the first matched will be used
  -->
  <mat-nested-tree-node
    *matTreeNodeDef="let node; when: hasChild"
    (expandedChange)="onExpandedChange(node.id, $event)"
    >

    <!-- display the expandable node (not include its children)  -->
    <div class="single-node-expandable">
      <!-- _note:
        Use matTreeNodeToggle to make the node expandable/collapsible
        To make the entire node expandable, change to: <div class="mat-tree-node" matTreeNodeToggle>
      -->
      <div class="mat-tree-node"
           [class.node-selected]="selectedNodeId() === node.id"
           (click)="onClick(node)"
           (contextmenu)="onContextMenu($event, node)">
        <button
          matIconButton
          matTreeNodeToggle
          [attr.aria-label]="'Toggle ' + node.name">
          <mat-icon class="mat-icon-rtl-mirror">
            {{tree.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
          </mat-icon>
        </button>
        <mat-icon>memory</mat-icon>
        <div class="single-node-item--inner">
          {{node.name}}
        </div>
      </div>
    </div>

    <!-- hide/display child nodes -->
    <div [class.hide-child-nodes]="!tree.isExpanded(node)">
      <!-- _note: Change indention in class 'all-child-nodes' -->
      <div class="all-child-nodes">
        <ng-container matTreeNodeOutlet></ng-container>
      </div>
    </div>
  </mat-nested-tree-node>
</mat-tree>

<!----------------------
--- node context menu ---
----------------------->

<!-- _note:
  Shown at the cursor when a node is right-clicked. 
  
  The document-level listeners close it on outside click / outside right-click / Escape;

  onContextMenu() calls stopPropagation() so the opening right-click doesn't immediately
  reach the document:contextmenu closer, otherwise the menu will close immediately when
  open.

  It's not based angular material menu.

  _warning: onContextMenu() of nested-tree1.ts clamps the menu position with hardcoded
  size estimates (width 178, height 108). If menu items are added/removed (or the menu
  styling changes its size), those numbers must be updated too.
-->
@if (contextMenu(); as menu) {
  <div class="tree-context-menu" role="menu"
       [style.left.px]="menu.x"
       [style.top.px]="menu.y"
       (document:click)="closeContextMenu()"
       (document:contextmenu)="closeContextMenu()"
       (document:keydown.escape)="closeContextMenu()">
    <button type="button" role="menuitem" class="tree-context-menu__item"
            (click)="onMenuItemClicked('add')">
      Add Group
    </button>
    <button type="button" role="menuitem" class="tree-context-menu__item"
            (click)="onMenuItemClicked('delete')">
      Delete Group
    </button>
    <button type="button" role="menuitem" class="tree-context-menu__item"
            (click)="onMenuItemClicked('rename')">
      Rename Group
    </button>
  </div>
}
